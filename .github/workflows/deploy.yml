name: Deploy

# Runs on pushes to main and by hand. It signs in to Azure with OpenID Connect, so no Azure secrets are stored.
# Needs these repository variables: AZURE_CLIENT_ID, AZURE_TENANT_ID, AZURE_SUBSCRIPTION_ID,
# RESOURCE_GROUP, FUNCTION_APP_NAME, STATIC_WEB_APP_NAME, DATA_BASE_URL.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: false

env:
  FUNCTION_APP_NAME: ${{ vars.FUNCTION_APP_NAME }}
  STATIC_WEB_APP_NAME: ${{ vars.STATIC_WEB_APP_NAME }}
  RESOURCE_GROUP: ${{ vars.RESOURCE_GROUP }}

jobs:
  functions:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build:node
      - name: Bundle function package
        run: npm run package -w @regs/functions
      - uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - uses: Azure/functions-action@v1
        with:
          app-name: ${{ env.FUNCTION_APP_NAME }}
          package: apps/functions/.deploy
          sku: flexconsumption

  web:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build:node
      - name: Require the published data URL
        run: test -n "$DATA_BASE_URL" || { echo "Repository variable DATA_BASE_URL is not set"; exit 1; }
        env:
          DATA_BASE_URL: ${{ vars.DATA_BASE_URL }}
      - name: Build web
        run: npm run build -w @regs/web
        env:
          VITE_DATA_BASE_URL: ${{ vars.DATA_BASE_URL }}
      - uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Get Static Web App deployment token
        id: swa
        run: |
          token=$(az staticwebapp secrets list --name "$STATIC_WEB_APP_NAME" --resource-group "$RESOURCE_GROUP" --query "properties.apiKey" -o tsv)
          echo "::add-mask::$token"
          echo "token=$token" >> "$GITHUB_OUTPUT"
      - uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ steps.swa.outputs.token }}
          action: upload
          app_location: apps/web/dist
          skip_app_build: true
          skip_api_build: true
