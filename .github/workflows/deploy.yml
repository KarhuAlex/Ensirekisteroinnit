name: Deploy

# Called by ci.yml after every check has passed on main, and can be started by hand. It signs in to
# Azure with OpenID Connect, so no Azure secrets are stored.
# Needs these repository variables: AZURE_CLIENT_ID, AZURE_TENANT_ID, AZURE_SUBSCRIPTION_ID,
# FUNCTION_APP_NAME, WEB_STORAGE_ACCOUNT, DATA_BASE_URL. Optional, for the privacy and contact
# sections: SITE_OPERATOR, SITE_CONTACT_URL, SITE_HOSTING, SITE_REPO_URL. Optional, for the sitemap:
# SITE_URL (the public address of the site, for example https://example.org).
on:
  workflow_call:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: false

env:
  FUNCTION_APP_NAME: ${{ vars.FUNCTION_APP_NAME }}
  WEB_STORAGE_ACCOUNT: ${{ vars.WEB_STORAGE_ACCOUNT }}

jobs:
  functions:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build:node
      - name: Bundle function package
        run: npm run package -w @regs/functions
      - uses: azure/login@v3
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - uses: Azure/functions-action@v1
        with:
          app-name: ${{ env.FUNCTION_APP_NAME }}
          package: apps/functions/.deploy
          sku: flexconsumption

  web:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build:node
      - name: Require the published data URL
        run: test -n "$DATA_BASE_URL" || { echo "Repository variable DATA_BASE_URL is not set"; exit 1; }
        env:
          DATA_BASE_URL: ${{ vars.DATA_BASE_URL }}
      - name: Build web
        run: npm run build -w @regs/web
        env:
          VITE_DATA_BASE_URL: ${{ vars.DATA_BASE_URL }}
      - name: Write site details
        run: node apps/web/scripts/write-site-config.mjs apps/web/dist/site.config.json
        env:
          SITE_OPERATOR: ${{ vars.SITE_OPERATOR }}
          SITE_CONTACT_URL: ${{ vars.SITE_CONTACT_URL }}
          SITE_HOSTING: ${{ vars.SITE_HOSTING }}
          SITE_REPO_URL: ${{ vars.SITE_REPO_URL }}
          SITE_URL: ${{ vars.SITE_URL }}
      - name: Write sitemap and robots.txt
        run: node apps/web/scripts/write-seo-files.mjs apps/web/dist
        env:
          SITE_URL: ${{ vars.SITE_URL }}
          DATA_BASE_URL: ${{ vars.DATA_BASE_URL }}
      - uses: azure/login@v3
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      # Hashed assets never change, so they can be cached for a year. Pages and icons are revalidated.
      - name: Upload assets
        run: >
          az storage blob upload-batch --account-name "$WEB_STORAGE_ACCOUNT" --auth-mode login --overwrite
          -d '$web' --destination-path assets -s apps/web/dist/assets
          --content-cache-control "public, max-age=31536000, immutable"
      # Map boundaries change only when the municipality division does, so a day of caching is plenty.
      - name: Upload map data
        run: >
          az storage blob upload-batch --account-name "$WEB_STORAGE_ACCOUNT" --auth-mode login --overwrite
          -d '$web' --destination-path geo -s apps/web/dist/geo
          --content-cache-control "public, max-age=86400"
      - name: Upload pages and icons
        run: |
          for pattern in '*.html' '*.svg' 'site.config.json' 'robots.txt' 'sitemap.xml'; do
            az storage blob upload-batch --account-name "$WEB_STORAGE_ACCOUNT" --auth-mode login --overwrite \
              -d '$web' -s apps/web/dist --pattern "$pattern" \
              --content-cache-control "public, max-age=0, must-revalidate"
          done
