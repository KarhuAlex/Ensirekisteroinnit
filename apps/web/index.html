<!doctype html>
<html lang="fi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="Henkilöautojen ensirekisteröinnit Suomessa: käyttövoimien osuudet, merkit ja mallit. / First registrations of passenger cars in Finland."
    />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>Ensirekisteröinnit</title>
    <script>
      try {
        var theme = localStorage.getItem('theme');
        if (theme === 'light' || theme === 'dark') document.documentElement.dataset.theme = theme;
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
